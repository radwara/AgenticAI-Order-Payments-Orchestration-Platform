name: ticket-lint
on:
  issues:
    types: [opened, edited]
jobs:
  lint:
    if: startsWith(github.event.issue.title, '[T-')
    runs-on: ubuntu-latest
    permissions: {issues: write}
    steps:
      - name: Check required sections
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          for s in "Why" "What" "Constraints" "Out of scope" "Acceptance criteria" "Files in scope" "Depends on"; do
            printf '%s' "$BODY" | grep -qi "^#\+ *$s" || { echo "Missing section: $s"; missing=1; }
          done
          [ -z "$missing" ] || exit 1
