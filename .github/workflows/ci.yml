name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Language build/test/lint jobs are added by ticket T-002 (path-filtered per service).
