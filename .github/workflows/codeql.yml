name: codeql
# CodeQL for Go and Java. A language is analysed only when the repo has source in
# it (CodeQL fails on a language with no code), so this is not a required check.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  languages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          set -eu
          langs=""
          [ -z "$(git ls-files '*.go' | head -1)" ] || langs="$langs go"
          [ -z "$(git ls-files '*.java' | head -1)" ] || langs="$langs java"
          echo "matrix=$(for l in $langs; do echo "$l"; done | jq -R . | jq -sc '{language: .}')" >> "$GITHUB_OUTPUT"

  analyze:
    needs: languages
    if: needs.languages.outputs.matrix != '{"language":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with: {go-version: stable, cache: false}
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Java needs no build; Go is built per module below (no go.work at the root).
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build every Go module
        if: matrix.language == 'go'
        run: for m in $(git ls-files 'go.mod' '**/go.mod'); do (cd "$(dirname "$m")" && go build ./...); done
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
