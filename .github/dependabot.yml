version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/libs/*", "/services/*"]
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directories: ["/libs/*", "/services/*"]
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
