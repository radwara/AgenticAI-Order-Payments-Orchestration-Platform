# PgBouncer in front of the primary (transaction pooling). Services connect to opop-pg-pooler-rw, never directly.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: opop-pg-pooler-rw
spec:
  cluster:
    name: opop-pg
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "400"
      default_pool_size: "20"
