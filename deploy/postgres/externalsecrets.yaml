# One ExternalSecret per service: maps a cloud secret (example names opop/dev/<service>/db with properties
# user, password, url) to the Kubernetes Secret <service>-db. url points at the pooler, for example
# jdbc:postgresql://opop-pg-pooler-rw:5432/<db>. Only secret NAMES live here, never values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secrets
  target:
    name: orders-db
    creationPolicy: Owner
    template:
      # basic-auth keys (username/password) feed the CNPG managed role; DB_* keys feed the service chart.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .user }}"
        password: "{{ .password }}"
        DB_USER: "{{ .user }}"
        DB_PASSWORD: "{{ .password }}"
        DB_URL: "{{ .url }}"
  data:
    - secretKey: user
      remoteRef:
        key: opop/dev/orders/db
        property: user
    - secretKey: password
      remoteRef:
        key: opop/dev/orders/db
        property: password
    - secretKey: url
      remoteRef:
        key: opop/dev/orders/db
        property: url
---
