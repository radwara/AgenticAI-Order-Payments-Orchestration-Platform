# One ExternalSecret per service: maps a cloud secret (example names opop/dev/<service>/db with properties
# user, password, url, migration_url; all are extracted) to the Secret <service>-db. url goes through the pooler
# (opop-pg-pooler-rw); migration_url is DIRECT to opop-pg-rw for Flyway/golang-migrate (session locks).
# The Secrets must live in the namespace of the Cluster and the pods. Only NAMES here, never values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secrets
  target:
    name: orders-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .user }}"
        password: "{{ .password }}"
        DB_USER: "{{ .user }}"
        DB_PASSWORD: "{{ .password }}"
        DB_URL: "{{ .url }}"
        DB_MIGRATION_URL: "{{ .migration_url }}"
  dataFrom:
    - extract:
        key: opop/dev/orders/db
