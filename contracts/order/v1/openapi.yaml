openapi: 3.1.0
info:
  title: Order API
  version: 1.0.0
  summary: Create, read, list and cancel orders.
  description: |
    Order Service external REST contract (SPEC-02, PRD 7.1, 7.2, ORD-1, ORD-4, ORD-6).

    - Money is an integer in minor units plus an ISO-4217 currency code. Never floats.
    - `POST /v1/orders` requires an `Idempotency-Key` header. Scope is merchant plus key,
      retention is 24 hours. The same key with the same body returns the original response;
      the same key with a different body returns 422.
    - Errors use RFC 9457 `application/problem+json`.
    - State changes happen only through the order state machine; an illegal transition
      (for example cancelling a COMPLETED order) is an error (409), not a no-op.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Relative to the API gateway host
tags:
  - name: Orders
    description: Order lifecycle operations.
security:
  - bearerAuth: []
paths:
  /v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created (or the original response replayed for a repeated idempotency key and identical body).
          headers:
            Location:
              description: URL of the created order.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders (cursor pagination)
      parameters:
        - name: limit
          in: query
          description: Maximum number of orders to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `next_cursor`.
          schema:
            type: string
        - name: state
          in: query
          description: Only return orders in this state.
          schema:
            $ref: '#/components/schemas/OrderState'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: |
        Moves the order to CANCELLED through the state machine. Cancelling an order whose
        state does not allow it returns 409.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order after cancellation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen unique key (scope merchant plus key, retained 24 hours).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OrderId:
      name: id
      in: path
      required: true
      description: Order identifier.
      schema:
        type: string
        format: uuid
  schemas:
    OrderState:
      type: string
      description: Order lifecycle state (SPEC-02).
      enum:
        - CREATED
        - PRICED
        - RESERVED
        - PAID
        - FULFILLING
        - COMPLETED
        - CANCELLED
        - FAILED
    Money:
      type: object
      description: Integer minor units plus ISO-4217 currency. Never floats.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount in minor units (for example cents).
          examples: [1999]
        currency:
          type: string
          description: ISO-4217 alphabetic currency code.
          pattern: '^[A-Z]{3}$'
          examples: [USD]
    OrderItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
    CreateOrderRequest:
      type: object
      required: [items, currency]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        currency:
          type: string
          description: ISO-4217 alphabetic currency code the order is priced in.
          pattern: '^[A-Z]{3}$'
    Order:
      type: object
      required: [id, state, items, total, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OrderState'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page; null or absent when there are no more results.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      additionalProperties: true
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Order not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Illegal state transition for the order's current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validation failed, or the Idempotency-Key was reused with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
